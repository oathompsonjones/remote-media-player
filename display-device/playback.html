<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Clubhouse display</title>
        <style>
            html,
            body,
            video {
                width: 100%;
                height: 100%;
                margin: 0;
                background: #000
            }

            video {
                object-fit: contain
            }
        </style>
    </head>
    <body><video id="player" autoplay muted playsinline></video>
        <script>
            const player = document.getElementById("player"); let playingId = null;
            async function metadata() { try { const response = await fetch("/local-metadata", { cache: "no-store" }); return await response.json(); } catch { return null; } }
            async function load() { const current = await metadata(); if (!current) { setTimeout(load, 10000); return; } playingId = current.id; player.src = "/current.mp4?video=" + encodeURIComponent(current.id); player.play().catch(() => { }); }
            player.addEventListener("ended", async () => { const current = await metadata(); if (current && current.id !== playingId) await load(); else { player.currentTime = 0; player.play().catch(() => { }); } });
            player.addEventListener("error", () => setTimeout(load, 5000)); load();
        </script>
    </body>
</html>
